<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --bg: #0b0d10; --surface: #14171c; --sunken: #1a1e24;
      --border: #262b33; --border-strong: #39414c;
      --text: #e6eaef; --muted: #9aa4b2; --faint: #7a8492;
      --accent: #60a5fa; --accent-contrast: #0b0f14; --accent-soft: #172236;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--text);
      font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: #60a5fa; text-decoration: none; } a:hover { color: #93c5fd; }
    .row-card { transition: border-color 0.12s ease, background-color 0.12s ease; }
    .row-card:hover { border-color: var(--border-strong); background: #171b21; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; display: flex; background: #0b0d10; overflow: hidden">

  <!-- Sidebar -->
  <nav style="width: 232px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid #262b33; background: #0e1114; padding: 20px 12px 16px 12px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 0 10px">
      <svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="0.75" y="4.5" width="18.5" height="11" rx="2.5" fill="none" stroke="#60a5fa" stroke-width="1.5"></rect>
        <path d="M8.6 7.4 L13.2 10 L8.6 12.6 Z" fill="#60a5fa"></path>
      </svg>
      <span style="font-weight: 600; font-size: 15.5px; letter-spacing: -0.01em">VideoShare</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 26px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; background: #172236; color: #e6eaef; font-weight: 500; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4.5" width="16" height="11" rx="2"></rect><path d="M8.6 7.9 L12.2 10 L8.6 12.1 Z" fill="#60a5fa" stroke="none"></path>
        </svg>
        <span>Videos</span>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: #9aa4b2; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="10" cy="10" r="7"></circle><circle cx="10" cy="10" r="2.6" fill="currentColor" stroke="none"></circle>
        </svg>
        <span>New recording</span>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: #9aa4b2; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h9M15.5 6h1.5M3 14h2M8.5 14H17"></path>
          <circle cx="13" cy="6" r="2"></circle><circle cx="6.5" cy="14" r="2"></circle>
        </svg>
        <span>Settings</span>
      </a>
    </div>

    <div style="flex-grow: 1"></div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; color: #7a8492; font-size: 12.5px">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <path d="M5.25 7.25V5.25a2.75 2.75 0 0 1 5.5 0v2"></path>
        <rect x="3" y="7.25" width="10" height="6.5" rx="1.6"></rect>
      </svg>
      <span>Encrypted in this browser</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 10px 2px 10px; border-top: 1px solid #262b33; margin-top: 8px">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: #172236; color: #60a5fa; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">C</span>
      <div style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-size: 13px; color: #e6eaef; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">cody@hypercomply.com</span>
        <a href="#" style="font-size: 12px; color: #7a8492">Sign out</a>
      </div>
    </div>
  </nav>

  <!-- Main column -->
  <main style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0; padding: 28px 40px; overflow: hidden">

    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.25">Videos</h1>
        <p style="margin: 0; color: #7a8492; font-size: 13.5px">5 recordings &middot; 48.2 MB in your bucket</p>
      </div>
      <button style="display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border: 1px solid #60a5fa; border-radius: 6px; background: #60a5fa; color: #0b0f14; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="10" cy="10" r="7"></circle><circle cx="10" cy="10" r="2.6" fill="currentColor" stroke="none"></circle>
        </svg>
        New recording
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{videos}}" as="v" hint-placeholder-count="5">
        <div class="row-card" style="display: flex; align-items: center; gap: 18px; padding: 12px; border: 1px solid #262b33; border-radius: 10px; background: #14171c">

          <div style="position: relative; width: 172px; height: 97px; flex-shrink: 0; border-radius: 6px; overflow: hidden; background: {{v.thumbBg}}; border: 1px solid #262b33">
            <div style="position: absolute; inset: 0; display: flex; flex-direction: column; gap: 5px; padding: 12px 14px; opacity: 0.55">
              <span style="height: 7px; width: 46%; border-radius: 2px; background: {{v.thumbLine}}"></span>
              <span style="height: 5px; width: 78%; border-radius: 2px; background: #2a3038"></span>
              <span style="height: 5px; width: 64%; border-radius: 2px; background: #2a3038"></span>
              <span style="height: 5px; width: 71%; border-radius: 2px; background: #232930"></span>
            </div>
            <span style="position: absolute; right: 6px; bottom: 6px; padding: 1px 7px; border-radius: 4px; background: rgba(4, 6, 8, 0.78); color: #e6eaef; font-size: 11.5px; font-family: var(--font-mono)">{{v.duration}}</span>
            <span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; background: rgba(4, 6, 8, 0.6); display: flex; align-items: center; justify-content: center">
              <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#e6eaef"></path></svg>
            </span>
          </div>

          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
            <span style="font-size: 15.5px; font-weight: 600; color: #e6eaef; letter-spacing: -0.01em">{{v.title}}</span>
            <span style="font-size: 13px; color: #7a8492">{{v.meta}}</span>
          </div>

          <div style="display: flex; align-items: center; gap: 18px; flex-shrink: 0">
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px; min-width: 84px">
              <span style="font-size: 15px; font-weight: 600; color: #e6eaef">{{v.views}}</span>
              <span style="font-size: 12px; color: #7a8492">{{v.viewsLabel}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px">
              <button style="display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border: 1px solid #39414c; border-radius: 6px; background: transparent; color: #e6eaef; font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer">
                <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                  <path d="M8.5 11.5 L11.5 8.5"></path>
                  <path d="M9 6.8 L11 4.8 a2.55 2.55 0 0 1 3.6 3.6 L12.6 10.4"></path>
                  <path d="M11 13.2 L9 15.2 a2.55 2.55 0 0 1 -3.6 -3.6 L7.4 9.6"></path>
                </svg>
                Copy link
              </button>
              <button style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: #7a8492; cursor: pointer" aria-label="More">
                <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                  <circle cx="4.5" cy="10" r="1.5"></circle><circle cx="10" cy="10" r="1.5"></circle><circle cx="15.5" cy="10" r="1.5"></circle>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const thumbs = [
      { bg: "linear-gradient(135deg, #10151c 0%, #131a24 100%)", line: "#3e5a80" },
      { bg: "linear-gradient(135deg, #12141a 0%, #171a22 100%)", line: "#4a4f68" },
      { bg: "linear-gradient(135deg, #101720 0%, #121d29 100%)", line: "#39617e" },
      { bg: "linear-gradient(135deg, #131417 0%, #191b20 100%)", line: "#575d66" },
      { bg: "linear-gradient(135deg, #101a1c 0%, #12211f 100%)", line: "#3f6e66" },
    ];
    const videos = [
      { title: "Sprint demo — auth gateway", meta: "Aug 31, 2026 · 4:12 · 11.8 MB · H.264", duration: "4:12", views: "38", viewsLabel: "views · 12 viewers" },
      { title: "Onboarding walkthrough for new hires", meta: "Aug 29, 2026 · 6:48 · 18.4 MB · H.264", duration: "6:48", views: "26", viewsLabel: "views · 9 viewers" },
      { title: "Bug repro: Safari playback stall", meta: "Aug 28, 2026 · 1:03 · 2.9 MB · VP9", duration: "1:03", views: "7", viewsLabel: "views · 3 viewers" },
      { title: "Q3 roadmap review", meta: "Aug 27, 2026 · 3:37 · 9.0 MB · H.264", duration: "3:37", views: "14", viewsLabel: "views · 6 viewers" },
      { title: "API pagination fix, before/after", meta: "Aug 26, 2026 · 2:20 · 6.1 MB · H.264", duration: "2:20", views: "3", viewsLabel: "views · 2 viewers" },
    ];
    return { videos: videos.map((v, i) => ({ ...v, thumbBg: thumbs[i].bg, thumbLine: thumbs[i].line })) };
  }
}
</script>
</body>
</html>
