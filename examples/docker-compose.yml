# VideoShare local stack: MinIO (S3-compatible bucket) + nginx (static site).
#
#   npm install && npm run build
#   docker compose -f examples/docker-compose.yml up -d
#   open http://localhost:8080
#
# Ports: 9000 S3 API, 9001 MinIO console (minioadmin / minioadmin), 8080 site.
#
# Paste these into the recorder's Settings panel:
#   Endpoint          http://localhost:9000
#   Region            us-east-1
#   Bucket            videoshare
#   Access key ID     videoshare-uploader
#   Secret access key videoshare-uploader-secret
#   Public base URL   http://localhost:9000/videoshare
#
# Tear down with `docker compose -f examples/docker-compose.yml down -v`
# (-v also drops the recorded videos).
#
# There is a fourth, optional service: the upload gateway (docs/gateway-setup.md),
# which keeps the bucket credentials out of the browser entirely. It sits behind
# the `gateway` compose profile and does not start unless you ask for it, because
# it needs a Google OAuth client id that only you can create:
#
#   VIDEOSHARE_GOOGLE_CLIENT_ID=...apps.googleusercontent.com \
#   VIDEOSHARE_ALLOWED_EMAILS=you@example.com \
#     docker compose -f examples/docker-compose.yml --profile gateway up -d

services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # MinIO has no per-bucket CORS configuration: it does not implement the S3
      # PutBucketCors API (`mc cors set` fails with NotImplemented), and instead
      # answers preflights permissively out of the box — it reflects the request
      # origin and the requested method/headers, so the multipart preflights
      # (POST to create and complete, DELETE to abort) come back allowed just as
      # readily as the player's GET. Its Access-Control-Expose-Headers already
      # covers ETag, Content-Length, Content-Range and Accept-Ranges — the ETag
      # being the one the recorder must read off every UploadPart response to
      # complete the upload. This one server-wide setting is the only knob;
      # narrow it to your site's origin for anything past local development.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
      # 8787 is the *gateway's* port, published here because that service shares
      # this container's network namespace (see its `network_mode` below).
      # Nothing listens on it unless you start the gateway profile.
      - "8787:8787"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  # One-shot: creates the video bucket and makes it anonymously readable
  # (objects only), mints an upload-only access key, creates the *private*
  # analytics bucket and the gateway's own key for it, and sets abandoned
  # multipart uploads to be swept after a day. Safe to re-run; exits 0 when done.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin > /dev/null
        mc mb --ignore-existing local/videoshare

        # Anonymous read of objects, and nothing else. Note this is NOT
        # `mc anonymous set download`, which additionally grants anonymous
        # s3:ListBucket and would let anyone enumerate every video id in the
        # bucket. Unguessable ids are half of the sharing model, so the policy
        # is written out longhand instead. Mirrors examples/s3-bucket-policy.json.
        cat > /tmp/anonymous-read.json <<'JSON'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "PublicReadObjectsOnly",
              "Effect": "Allow",
              "Principal": "*",
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::videoshare/*"]
            }
          ]
        }
        JSON
        mc anonymous set-json /tmp/anonymous-read.json local/videoshare

        # Upload-only credentials for the recorder. PutObject authorizes the
        # whole multipart write path — create, every part, complete — but
        # abandoning an upload is authorized separately: without
        # s3:AbortMultipartUpload, MinIO answers the recorder's Discard with a
        # 403 (verified against RELEASE.2025-09-07T16-13-09Z). These keys still
        # cannot read, list, or delete a stored object, so losing them costs you
        # spam in the bucket, not your videos.
        # Mirrors examples/iam-uploader-policy.json.
        cat > /tmp/uploader-policy.json <<'JSON'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "VideoShareUploadOnly",
              "Effect": "Allow",
              "Action": ["s3:PutObject", "s3:AbortMultipartUpload"],
              "Resource": ["arn:aws:s3:::videoshare/*"]
            }
          ]
        }
        JSON
        mc admin user add local videoshare-uploader videoshare-uploader-secret
        mc admin policy create local videoshare-uploader /tmp/uploader-policy.json
        mc admin policy attach local videoshare-uploader --user videoshare-uploader

        # The analytics bucket (docs/SPEC.md §16). It holds one small encrypted
        # object per viewing session and it is PRIVATE: no anonymous policy is
        # applied to it, deliberately and by omission. The bucket above is
        # world-readable because share links have to work without credentials;
        # this one must not be, or every session object would be downloadable by
        # anyone who guessed a video id. They are separate buckets for exactly
        # that reason, and the gateway refuses to start if you point
        # ANALYTICS_BUCKET at the public one.
        #
        # It needs no CORS for writes — the gateway writes it server-side — but
        # the recorder page fetches session objects straight from presigned URLs,
        # so it does need GET CORS from the site's origin. That is the same
        # server-wide MINIO_API_CORS_ALLOW_ORIGIN as everything else here.
        mc mb --ignore-existing local/videoshare-analytics

        # Credentials for the gateway, and only for the gateway: they are never
        # pasted into a browser, so they can carry the extra authority analytics
        # needs without widening what a recorder holds.
        #
        # GetObject on the analytics bucket looks surprising for a service that
        # never reads an object — but a presigned URL inherits the authority of
        # the key that signed it, so without it the dashboard's downloads would
        # come back 403. ListBucket is scoped to the bucket itself (no /*),
        # which is what ListObjectsV2 authorizes against, and it is granted on
        # the analytics bucket alone: video ids stay unguessable.
        cat > /tmp/gateway-policy.json <<'JSON'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "VideoShareUploadOnly",
              "Effect": "Allow",
              "Action": ["s3:PutObject", "s3:AbortMultipartUpload"],
              "Resource": ["arn:aws:s3:::videoshare/*"]
            },
            {
              "Sid": "VideoShareAnalyticsWriteAndRead",
              "Effect": "Allow",
              "Action": ["s3:PutObject", "s3:GetObject"],
              "Resource": ["arn:aws:s3:::videoshare-analytics/*"]
            },
            {
              "Sid": "VideoShareAnalyticsList",
              "Effect": "Allow",
              "Action": ["s3:ListBucket"],
              "Resource": ["arn:aws:s3:::videoshare-analytics"]
            }
          ]
        }
        JSON
        mc admin user add local videoshare-gateway videoshare-gateway-secret
        mc admin policy create local videoshare-gateway /tmp/gateway-policy.json
        mc admin policy attach local videoshare-gateway --user videoshare-gateway

        # Sweep multipart uploads that were never completed — a closed tab or a
        # crashed browser mid-recording leaves parts behind, and unfinished
        # parts are billed like objects while being invisible to a plain `ls`.
        #
        # This is *not* a bucket lifecycle rule here. MinIO rejects a lifecycle
        # rule whose only action is AbortIncompleteMultipartUpload with
        # InvalidArgument, and silently drops that action from a rule that also
        # carries an Expiration — so `mc ilm rule add/import` cannot express it
        # (verified against RELEASE.2025-09-07T16-13-09Z). The server-wide knob
        # below is MinIO's equivalent, and 24h is already its default; it is set
        # explicitly so this stack visibly matches what docs/storage-setup.md
        # tells you to configure on S3 and R2. The sweep itself runs every
        # api stale_uploads_cleanup_interval (6h by default), so a stranded
        # upload lives at most about 30 hours.
        mc admin config set local api stale_uploads_expiry=24h > /dev/null

        echo
        echo "  Recorder settings (http://localhost:8080 -> Settings)"
        echo "  ---------------------------------------------------"
        echo "  Endpoint           http://localhost:9000"
        echo "  Region             us-east-1"
        echo "  Bucket             videoshare"
        echo "  Access key ID      videoshare-uploader"
        echo "  Secret access key  videoshare-uploader-secret"
        echo "  Public base URL    http://localhost:9000/videoshare"
        echo
        echo "  Buckets: videoshare (public read) + videoshare-analytics (private)"
        echo

  # OPTIONAL — the upload gateway (docs/SPEC.md §15, docs/gateway-setup.md).
  #
  # Off by default: it is only reachable under `--profile gateway`, because
  # signing in needs a Google OAuth client id that has http://localhost:8080 in
  # its authorized JavaScript origins, and only you can create one. Supply it as
  # VIDEOSHARE_GOOGLE_CLIENT_ID (and yourself as VIDEOSHARE_ALLOWED_EMAILS);
  # leave either unset and the gateway exits at boot saying which is missing —
  # it validates its whole environment before it listens.
  #
  # Then point the recorder at it by uncommenting one line in public/config.js:
  #
  #   gatewayUrl: "http://localhost:8787/api"
  #
  # and rebuilding (`npm run build`). The Settings panel disappears; recording
  # asks you to sign in instead.
  #
  # Runs the sources straight from ../gateway with Node's own type stripping, so
  # `npm --prefix gateway install` must have run first — same deal as ../dist for
  # the web service below. Nothing is written back: the mount is read-only.
  gateway:
    profiles: ["gateway"]
    image: node:24-alpine
    working_dir: /app
    command: ["node", "src/node.ts"]
    depends_on:
      minio:
        condition: service_healthy
    # Shares MinIO's network namespace, which is what makes ONE endpoint string
    # correct in two places at once. BUCKET_ENDPOINT is signed into URLs the
    # *browser* dereferences, so it has to be http://localhost:9000 — and with
    # analytics on (SPEC §16.3) the gateway also PUTs beacons to that same URL
    # itself, which from an ordinary container would be its own loopback. Here
    # `localhost` is MinIO's loopback for both. The cost is that the gateway
    # cannot publish its own port; 8787 is published by the minio service above.
    network_mode: "service:minio"
    volumes:
      - ../gateway:/app:ro
    environment:
      # http://localhost:9000, NOT http://minio:9000 — this is the endpoint the
      # gateway signs URLs for, and it is the browser that dereferences them.
      # The gateway is still not in the data path (SPEC §15: it signs, it does
      # not proxy); the one thing it sends itself is a ≤16 KiB encrypted beacon.
      BUCKET_ENDPOINT: http://localhost:9000
      BUCKET_NAME: videoshare
      BUCKET_REGION: us-east-1
      # The gateway's own key, minted by the init job above. Held by a container
      # you run rather than by every browser, so it can carry what analytics
      # needs — write beacons, list them, and sign reads of them — on top of the
      # recorder's PutObject and AbortMultipartUpload. Set no ANALYTICS_BUCKET
      # and videoshare-uploader's narrower key does just as well.
      BUCKET_ACCESS_KEY_ID: videoshare-gateway
      BUCKET_SECRET_ACCESS_KEY: videoshare-gateway-secret
      PUBLIC_BASE_URL: http://localhost:9000/videoshare
      # Playback analytics (SPEC §16). Comment this out and analytics is simply
      # off: /api/config answers analytics:false, the player sends no beacons,
      # and the recorder's library shows no analytics at all. That is a
      # supported setup, not a broken one.
      ANALYTICS_BUCKET: videoshare-analytics
      # Yours, from console.cloud.google.com → Clients → Create client → Web
      # application, with http://localhost and http://localhost:8080 as
      # authorized JavaScript origins. See docs/gateway-setup.md.
      GOOGLE_CLIENT_ID: ${VIDEOSHARE_GOOGLE_CLIENT_ID:-}
      # Who may upload: comma-separated, each entry a full address or an
      # "@domain.com" suffix, matched case-insensitively. There is no default —
      # an empty whitelist is a closed door, not an open one.
      ALLOWED_EMAILS: ${VIDEOSHARE_ALLOWED_EMAILS:-}
      # Exactly where the site is served from, below. Never "*": a wildcard here
      # would let any page on the internet spend these credentials on behalf of
      # someone who is signed in.
      ALLOWED_ORIGINS: http://localhost:8080
      PRESIGN_EXPIRY_SECONDS: "900"
      PORT: "8787"

  # Serves the built site. `npm run build` must have produced dist/ first —
  # Docker creates an empty directory for a missing bind mount, which shows up
  # as a 403 from nginx rather than an error here.
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro

volumes:
  minio-data:
